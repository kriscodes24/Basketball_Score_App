<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Score App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div>
            <h3>Home</h3>
            <h1 id="homecount">0</h1>
            <button onclick="homeCountOne()">+1</button>
            <button onclick="homeCountTwo()">+2</button>
            <button onclick="homeCountThree()">+3</button>
        </div>
        <div>
            <h3>Away</h3>
            <h1 id="guestcount">0</h1>
            <button onclick="guestCountOne()">+1</button>
            <button onclick="guestCountTwo()">+2</button>
            <button onclick="guestCountThree()">+3</button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
